<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Leestraining B1</title>
<script>
  // Set the theme attribute before the stylesheet below is applied, so a saved
  // dark/sepia preference (or a dark OS setting on a first visit) paints
  // immediately instead of flashing light first.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (!t && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
      if (t === 'dark' || t === 'sepia') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
  :root{--bg:#f0ede6;--surface:#faf8f4;--border:#d6d0c4;--text:#1c1a16;--muted:#6b6558;--accent:#2b5c3e;--accent-solid:#2b5c3e;--accent-light:#e8f0eb;--wrong:#8b2020;--wrong-light:#f5e8e8;--label:#8a7f6e;--divider:#ddd8ce;--highlight-bg:rgba(245,230,66,.38)}
  html[data-theme="dark"]{--bg:#17181a;--surface:#232522;--border:#3a3d37;--text:#eae7dd;--muted:#a19c8a;--accent:#7fc79c;--accent-solid:#3f7a58;--accent-light:#233229;--wrong:#e08585;--wrong-light:#3d2323;--label:#948d78;--divider:#33352f;--highlight-bg:rgba(245,230,66,.3)}
  html[data-theme="sepia"]{--bg:#ece1c8;--surface:#f6eed9;--border:#d9c9a1;--text:#3b2f1e;--muted:#7d6c4c;--accent:#2b5c3e;--accent-solid:#2b5c3e;--accent-light:#e1ecd8;--wrong:#8b2020;--wrong-light:#f0dbd4;--label:#8f7b55;--divider:#ddcda8;--highlight-bg:rgba(245,197,66,.45)}
  @media (prefers-color-scheme: dark){
    html:not([data-theme]){--bg:#17181a;--surface:#232522;--border:#3a3d37;--text:#eae7dd;--muted:#a19c8a;--accent:#7fc79c;--accent-solid:#3f7a58;--accent-light:#233229;--wrong:#e08585;--wrong-light:#3d2323;--label:#948d78;--divider:#33352f;--highlight-bg:rgba(245,230,66,.3)}
  }
  html{background:var(--bg)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'IBM Plex Sans',sans-serif;color:var(--text);min-height:100vh;padding:24px 16px 60px}
  .container{max-width:680px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;border-bottom:2px solid var(--accent);padding-bottom:12px;flex-wrap:wrap}
  .header-left{display:flex;align-items:baseline;gap:12px}
  header h1{font-family:'IBM Plex Serif',serif;font-size:1.4rem;font-weight:600;color:var(--accent)}
  .badge{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .streak-badge{color:#c9702f}
  .theme-toggle-btn{background:var(--surface);border:1px solid var(--border);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.05rem;line-height:1;flex-shrink:0;transition:border-color .12s,transform .12s}
  .theme-toggle-btn:hover{border-color:var(--accent);transform:scale(1.06)}
  .milestone-toast{display:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--accent-solid);color:#fff;padding:12px 22px;border-radius:24px;font-size:.88rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:60;white-space:nowrap}
  .milestone-toast.show{display:block;animation:toastIn .25s ease}
  @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  .tabs{display:flex;margin-bottom:22px;border-bottom:1px solid var(--divider)}
  .tab-btn{background:none;border:none;border-bottom:2px solid transparent;padding:8px 16px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;font-weight:500;color:var(--muted);cursor:pointer;margin-bottom:-1px;transition:color .15s,border-color .15s}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .count-badge{display:inline-block;background:var(--border);color:var(--muted);border-radius:9px;font-size:.68rem;font-weight:600;padding:1px 7px;margin-left:5px;vertical-align:middle}
  .tab-panel{display:none}.tab-panel.active{display:block}
  .picker-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
  .picker-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .picker-label{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .picker-nav{display:flex;align-items:center;gap:8px}
  .fav-filter-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:14px;font-family:'IBM Plex Sans',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .fav-filter-btn:hover{border-color:#c9a227;color:#c9a227}
  .fav-filter-btn.active{background:#c9a227;border-color:#c9a227;color:#fff}
  .dots-empty{font-size:.85rem;color:var(--muted)}
  .nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:3px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;color:var(--muted);transition:border-color .12s,color .12s}
  .nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .nav-btn:disabled{opacity:.35;cursor:default}
  .nav-counter{font-size:.82rem;color:var(--muted);min-width:52px;text-align:center}
  .topic-dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
  .topic-dot{position:relative;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;transition:background .12s,border-color .12s,box-shadow .12s;padding:0}
  .topic-dot.favourite::after{content:'';position:absolute;top:-3px;right:-3px;width:5px;height:5px;border-radius:50%;background:#c9a227;border:1px solid var(--surface)}
  .topic-dot.in-progress{background:var(--accent-light);border-color:var(--accent)}
  .topic-dot.score-green{background:var(--accent);border-color:var(--accent)}
  .topic-dot.score-yellow{background:#c9a227;border-color:#c9a227}
  .topic-dot.score-orange{background:#c9702f;border-color:#c9702f}
  .topic-dot.score-red{background:var(--wrong);border-color:var(--wrong)}
  .topic-dot.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-light)}
  .passage-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:22px;margin-bottom:18px}
  .passage-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .passage-label{font-size:.67rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
  .topic-tag{font-size:.67rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:2px}
  .passage-title{font-family:'IBM Plex Serif',serif;font-size:1.1rem;font-weight:600;margin-bottom:13px;line-height:1.3}
  .passage-text{font-family:'IBM Plex Serif',serif;font-size:.97rem;line-height:1.78}
  .passage-text p+p{margin-top:10px}
  .passage-text mark{background:var(--highlight-bg);border-bottom:2px solid #c8b800;border-radius:2px;padding:0 1px;font-style:normal;animation:fadeH .4s ease}
  @keyframes fadeH{from{background:rgba(245,230,66,.7)}to{background:var(--highlight-bg)}}
  .q-progress{display:flex;gap:5px;margin-bottom:14px}
  .q-pip{height:6px;flex:1;border-radius:3px;background:var(--border);cursor:pointer;transition:background .15s,transform .1s;border:none;padding:0}
  .q-pip:hover{transform:scaleY(1.5)}
  .q-pip.done-correct{background:var(--accent)}
  .q-pip.done-wrong{background:var(--wrong)}
  .q-pip.current{background:var(--accent);opacity:.45}
  .question-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px}
  .question-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
  .question-number{font-size:.67rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .question-type-tag{font-size:.64rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--label);background:var(--bg);border:1px solid var(--border);padding:2px 7px;border-radius:2px}
  .question-text{font-size:.95rem;font-weight:500;line-height:1.5;margin-bottom:14px}
  .options{display:flex;flex-direction:column;gap:7px}
  .option{display:flex;align-items:flex-start;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:3px;cursor:pointer;font-size:.88rem;line-height:1.4;background:transparent;user-select:none;transition:background .12s,border-color .12s}
  .option:hover:not(.disabled){background:var(--accent-light);border-color:var(--accent)}
  .option.selected{background:var(--accent-light);border-color:var(--accent)}
  .option.correct{background:var(--accent-light);border-color:var(--accent)}
  .option.correct .option-letter{color:var(--accent);font-weight:700}
  .option.wrong{background:var(--wrong-light);border-color:var(--wrong);text-decoration:line-through;opacity:.7}
  .option.wrong .option-letter{color:var(--wrong)}
  .option.disabled{cursor:default}
  .option-letter{font-weight:600;font-size:.78rem;color:var(--label);min-width:16px;padding-top:1px;flex-shrink:0}
  .feedback{display:none;margin-top:13px;padding:10px 13px;border-radius:3px;font-size:.84rem;line-height:1.5}
  .feedback.show{display:block}
  .feedback.ok{background:var(--accent-light);color:var(--accent);border-left:3px solid var(--accent)}
  .feedback.nee{background:var(--wrong-light);color:var(--wrong);border-left:3px solid var(--wrong)}
  .highlight-note{display:none;margin-top:8px;font-size:.78rem;color:var(--label);font-style:italic}
  .highlight-note.show{display:block}
  .controls{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .btn-primary{background:var(--accent-solid);color:white;border:none;padding:10px 22px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .15s}
  .btn-primary:hover:not(:disabled){opacity:.85}
  .btn-primary:disabled{opacity:.4;cursor:default}
  .btn-secondary{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 18px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s}
  .btn-secondary:hover{border-color:var(--muted);color:var(--text)}
  .btn-back{background:transparent;color:var(--muted);border:1px solid var(--border);padding:10px 14px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s}
  .btn-back:hover{border-color:var(--accent);color:var(--accent)}
  .score-bar{display:none;margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px 18px;gap:14px;align-items:center;flex-wrap:wrap}
  .score-bar.show{display:flex}
  .score-number{font-family:'IBM Plex Serif',serif;font-size:1.5rem;font-weight:600;color:var(--accent);white-space:nowrap}
  .score-text{font-size:.83rem;color:var(--muted);line-height:1.4}
  .btn-next-text{background:var(--accent-light);color:var(--accent);border:1.5px solid var(--accent);padding:10px 18px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:background .15s;display:none;margin-top:12px}
  .btn-next-text.show{display:inline-block}
  .btn-next-text:hover{background:var(--accent-light)}
  .all-done{display:none;text-align:center;padding:40px 24px;background:var(--surface);border:1px solid var(--border);border-radius:4px;margin-bottom:20px}
  .all-done.show{display:block}
  .all-done .big-score{font-family:'IBM Plex Serif',serif;font-size:2.8rem;font-weight:600;color:var(--accent);line-height:1;margin-bottom:6px}
  .all-done p{font-size:.9rem;color:var(--muted);margin-top:6px;line-height:1.5}
  .all-done .restart-all{margin-top:20px}
  .en-toggle-btn{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:3px 9px;border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s,color .12s;flex-shrink:0}
  .en-toggle-btn:hover{border-color:var(--accent);color:var(--accent)}
  .en-toggle-btn.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
  .en-toggle-btn[hidden]{display:none}
  .passage-meta .fav-star-btn{margin-left:auto}
  .fav-star-btn{background:none;border:none;font-size:1.05rem;line-height:1;color:var(--border);cursor:pointer;padding:2px;flex-shrink:0;transition:color .12s,transform .12s}
  .fav-star-btn:hover{color:#c9a227;transform:scale(1.1)}
  .fav-star-btn.active{color:#c9a227}
  .meta-right{display:flex;align-items:center;gap:8px}
  .tapword{cursor:pointer;border-radius:2px;padding:0 1px;touch-action:manipulation;transition:background .1s}
  .tapword:hover{background:var(--accent-light)}
  .tapword.tapped{background:var(--accent-light)}
  .tapword.saved{background:var(--accent-light);box-shadow:inset 0 -2px 0 var(--accent)}
  .word-tooltip{display:none;position:fixed;z-index:50;max-width:260px;background:#1c1a16;color:#faf8f4;border-radius:5px;padding:10px 12px;font-size:.82rem;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.22)}
  .word-tooltip.show{display:block}
  .word-tooltip .wt-word{font-family:'IBM Plex Serif',Georgia,serif;font-weight:600;font-size:.9rem;display:block;margin-bottom:2px}
  .word-tooltip .wt-gloss{color:#e8e5dd}
  .word-tooltip .wt-hint{display:block;margin-top:6px;font-size:.7rem;color:#b9b4a7;font-style:italic}
  .word-tooltip .wt-saved{color:#9ed6ae;font-weight:600;font-style:normal}
  .word-tooltip .wt-removed{color:#d9a5a5;font-weight:600;font-style:normal}
  .bank-empty{text-align:center;padding:40px 24px;color:var(--muted);font-size:.88rem;background:var(--surface);border:1px solid var(--border);border-radius:4px}
  .bank-empty strong{display:block;font-family:'IBM Plex Serif',serif;font-size:1rem;color:var(--text);margin-bottom:6px}
  .bank-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .bank-sort{display:flex;gap:6px}
  .sort-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:5px 12px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .sort-btn:hover{border-color:var(--accent);color:var(--accent)}
  .sort-btn.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
  .bank-actions{display:flex;gap:10px;flex-wrap:wrap}
  .bank-filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .filter-chip{background:var(--surface);border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:14px;font-family:'IBM Plex Sans',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .filter-chip:hover{border-color:var(--accent);color:var(--accent)}
  .filter-chip.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
  .fav-filter-chip.active{background:#c9a227;border-color:#c9a227}
  .bank-topic-select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:4px 10px;border-radius:14px;font-family:'IBM Plex Sans',sans-serif;font-size:.75rem;font-weight:600;cursor:pointer;margin-left:auto}
  .bank-topic-select:hover{border-color:var(--accent)}
  .bank-status{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:9px;white-space:nowrap;flex-shrink:0}
  .bank-status-learnt{background:var(--accent-light);color:var(--accent)}
  .bank-status-studying{background:#fef3e2;color:#8a5c00}
  .wb-summary{font-size:.88rem;color:var(--text);margin-bottom:10px}
  .wb-summary-pct{font-family:'IBM Plex Serif',serif;font-weight:600;color:var(--accent);font-size:1.1rem}
  .bank-list{display:flex;flex-direction:column;gap:12px}
  .bank-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:14px 16px;position:relative}
  .bank-card-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-right:20px}
  .bank-word-group{display:flex;align-items:center;gap:4px}
  .bank-word{font-family:'IBM Plex Serif',serif;font-size:1rem;font-weight:600}
  .bank-fav-btn{background:none;border:none;font-size:.95rem;line-height:1;color:var(--border);cursor:pointer;padding:2px;flex-shrink:0;transition:color .12s,transform .12s}
  .bank-fav-btn:hover{color:#c9a227;transform:scale(1.1)}
  .bank-fav-btn.active{color:#c9a227}
  .bank-gloss{font-size:.83rem;color:var(--accent);margin-top:2px}
  .bank-sentence{font-size:.85rem;color:var(--muted);line-height:1.5;margin-top:8px}
  .bank-sentence mark{background:var(--highlight-bg);border-radius:2px;padding:0 1px;font-style:normal}
  .bank-word-practice{margin-top:12px;background:none;border:1px solid var(--border);color:var(--accent);padding:6px 12px;border-radius:3px;font-family:'IBM Plex Sans',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
  .bank-word-practice:hover{border-color:var(--accent);background:var(--accent-light)}
  .bank-remove{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--label);font-size:1rem;line-height:1;cursor:pointer;padding:4px;transition:color .12s}
  .bank-remove:hover{color:var(--wrong)}
  .bank-practice-inner{display:flex;flex-direction:column;align-items:center;gap:14px}
  .practice-progress{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--label)}
  .practice-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:32px 28px;width:100%;max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
  .practice-card .quiz-question{font-size:.95rem;font-weight:500;color:var(--text)}
  .practice-card .quiz-options{width:100%;text-align:left}
  .practice-sentence{font-family:'IBM Plex Serif',serif;font-size:1.05rem;line-height:1.6;color:var(--text)}
  .practice-sentence mark{background:var(--highlight-bg);border-radius:2px;padding:0 1px;font-style:normal}
  .sentence-en-toggle{display:block;margin:10px auto 0;background:none;border:1px solid var(--border);color:var(--accent);padding:4px 10px;border-radius:12px;font-family:'IBM Plex Sans',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.05em;cursor:pointer;transition:border-color .12s,background .12s}
  .sentence-en-toggle:hover{border-color:var(--accent);background:var(--accent-light)}
  .quiz-sentence-hidden{width:100%;padding:14px 0}
  .quiz-reveal-btn{background:none;border:1px dashed var(--border);color:var(--accent);padding:8px 16px;border-radius:4px;font-family:'IBM Plex Sans',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;transition:border-color .12s,background .12s}
  .quiz-reveal-btn:hover{border-color:var(--accent);background:var(--accent-light)}
  .option-source{color:var(--muted);font-style:italic;font-size:.82rem}
  .practice-answer{display:flex;flex-direction:column;gap:4px}
  .practice-word{font-family:'IBM Plex Serif',serif;font-size:1.3rem;font-weight:600;color:var(--accent)}
  .practice-gloss{font-size:.95rem;color:var(--muted)}
  .practice-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .practice-done{text-align:center;padding:40px 24px;background:var(--surface);border:1px solid var(--border);border-radius:4px;max-width:440px;width:100%}
  .practice-done-title{font-family:'IBM Plex Serif',serif;font-size:1.05rem;font-weight:600;margin-bottom:16px;color:var(--text);line-height:1.4}
  .practice-done-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .stats-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
  .stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:16px 18px}
  .stat-value{font-family:'IBM Plex Serif',serif;font-size:1.7rem;font-weight:600;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .stat-label{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--label);margin-top:6px}
  .stat-sub{font-size:.68rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
  .stats-section{margin-bottom:26px}
  .stats-section-title{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--label);margin-bottom:12px}
  .stat-bars{display:flex;flex-direction:column;gap:12px}
  .stat-bar-row{display:grid;grid-template-columns:112px 1fr auto;align-items:center;gap:10px}
  .stat-bar-label{font-size:.83rem;color:var(--text)}
  .stat-bar-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
  .stat-bar-fill{height:100%;border-radius:4px;background:var(--accent)}
  .stat-bar-value{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .stat-bar-count{color:var(--label)}
  .stat-bar-nodata{font-style:italic;color:var(--label)}
  .dist-bar{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--bg)}
  .dist-segment{height:100%}
  .dist-segment.score-green{background:var(--accent)}
  .dist-segment.score-yellow{background:#c9a227}
  .dist-segment.score-orange{background:#c9702f}
  .dist-segment.score-red{background:var(--wrong)}
  .dist-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
  .dist-legend-item{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
  .dist-legend-item strong{color:var(--text);font-variant-numeric:tabular-nums}
  .dist-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .dist-dot.score-green{background:var(--accent)}
  .dist-dot.score-yellow{background:#c9a227}
  .dist-dot.score-orange{background:#c9702f}
  .dist-dot.score-red{background:var(--wrong)}
  .dist-segment.word-learnt{background:var(--accent)}
  .dist-segment.word-studying{background:#c9a227}
  .dist-segment.word-untested{background:#c4bdae}
  .dist-dot.word-learnt{background:var(--accent)}
  .dist-dot.word-studying{background:#c9a227}
  .dist-dot.word-untested{background:#c4bdae}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left"><h1>Leestraining</h1><span class="badge">Niveau B1 &middot; NT2</span><span class="badge streak-badge" id="streakBadge" title="Opeenvolgende teksten met minstens 4/5 goed" hidden>&#128293; 0</span></div>
    <button class="theme-toggle-btn" id="themeToggleBtn" onclick="cycleTheme()"></button>
  </header>
  <div class="tabs">
    <button class="tab-btn active" id="tabOefeningBtn" onclick="switchTab('oefening',this)">Oefening</button>
    <button class="tab-btn" id="tabBankBtn" onclick="switchTab('geheugenbank',this)">Geheugenbank <span class="count-badge" id="bankCount">0</span></button>
    <button class="tab-btn" id="tabStatsBtn" onclick="switchTab('statistieken',this)">Statistieken</button>
  </div>
  <div class="tab-panel active" id="tab-oefening">
    <div class="picker-header">
      <div class="picker-left">
        <span class="picker-label">Tekst kiezen</span>
        <button class="fav-filter-btn" id="favTextsFilterBtn" onclick="toggleShowOnlyFavouriteTexts()">&#9733; Favorieten</button>
      </div>
      <div class="picker-nav">
        <button class="nav-btn" id="prevBtn" onclick="goToPrevText()">&#8592;</button>
        <span class="nav-counter" id="navCounter"></span>
        <button class="nav-btn" id="nextBtn" onclick="goToNextText()">&#8594;</button>
      </div>
    </div>
    <div class="topic-dots" id="topicDots"></div>
    <div class="all-done" id="allDone">
      <div class="big-score" id="allDoneScore"></div>
      <p id="allDoneText"></p>
      <button class="btn-primary restart-all" onclick="restartAll()">Alle teksten opnieuw</button>
    </div>
    <div id="exerciseArea">
      <div class="passage-card">
        <div class="passage-meta"><span class="passage-label">Tekst &mdash; lees aandachtig</span><span class="topic-tag" id="topicTag"></span><button class="fav-star-btn" id="textFavBtn" onclick="toggleTextFavourite(currentIdx)">&#9733;</button><button class="en-toggle-btn" id="passageEnBtn" onclick="togglePassageEN()">EN</button></div>
        <div class="passage-title" id="passageTitle"></div>
        <div class="passage-text" id="passageBody"></div>
      </div>
      <div class="q-progress" id="qProgress"></div>
      <div class="question-card">
        <div class="question-meta">
          <span class="question-number" id="qNumber"></span>
          <div class="meta-right">
            <span class="question-type-tag" id="qTypeTag"></span>
            <button class="en-toggle-btn" id="questionEnBtn" onclick="toggleQuestionEN()">EN</button>
          </div>
        </div>
        <div class="question-text" id="qText"></div>
        <div class="options" id="qOptions"></div>
        <div class="feedback" id="qFeedback"></div>
        <div class="highlight-note" id="highlightNote">&#8593; Het antwoord is gemarkeerd in de tekst hierboven.</div>
      </div>
      <div class="controls" id="controls"></div>
      <div class="score-bar" id="scoreBar"></div>
      <button class="btn-next-text" id="nextTextBtn" onclick="goToNext()">Volgende tekst &rarr;</button>
    </div>
  </div>
  <div class="tab-panel" id="tab-geheugenbank">
    <div id="bankListView"><div id="memoryBankList"></div></div>
    <div id="bankPracticeView" hidden></div>
  </div>
  <div class="tab-panel" id="tab-statistieken"><div id="statsContent"></div></div>
</div>
<div class="word-tooltip" id="wordTooltip"></div>
<div class="milestone-toast" id="milestoneToast"></div>
<!-- Bump the ?v= on every deploy that changes these files: GitHub Pages / mobile
     Safari can otherwise keep serving a stale cached copy after an update. -->
<script src="texts.js?v=3"></script>
<script src="glossary.js?v=3"></script>
<script src="wordindex.js?v=3"></script>
<script src="sentenceindex.js?v=3"></script>
<script src="app.js?v=9"></script>
</body>
</html>
